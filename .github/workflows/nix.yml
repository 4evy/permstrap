name: Nix

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Check and build flake
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build flake
        run: nix build --print-build-logs --out-link result

      - name: Package build artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            result/Applications/Permstrap.app Permstrap-nix-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permstrap-nix-${{ github.sha }}
          path: Permstrap-nix-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
