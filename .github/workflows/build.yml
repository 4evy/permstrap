name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build tools
        shell: bash
        run: |
          brew install just ninja shellcheck shfmt
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install meson==1.11.2
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: Build and verify
        run: just verify

      - name: Package build artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Permstrap.app Permstrap-debug-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permstrap-${{ github.sha }}
          path: Permstrap-debug-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
